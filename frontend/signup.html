<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — FocusArc</title>
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/signup.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-visual">
      <svg class="auth-leaf" style="top:15%; left:15%; width:22px; height:22px;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.5"/></svg>
      <svg class="auth-leaf" style="top:55%; left:65%; width:20px; height:20px; animation-delay:3s;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.4"/></svg>

      <div class="auth-visual-brand">
        <svg class="auth-visual-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z"/><path d="M6 19c4-5 8-8 13-11"/></svg>
        <span class="auth-visual-brand-text brand">FocusArc</span>
      </div>
      <div class="auth-visual-tagline">Study Quest System</div>
      <p class="auth-visual-copy">Create your account and begin your <span>study arc</span> today.</p>

      <img class="auth-character" src="/assets/characters/l.jpg" alt="Your study companion" />
    </section>

    <section class="auth-form-panel">
      <div class="auth-card fade-in">
        <svg class="auth-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="12" cy="8" r="3.4"/>
          <path d="M5 20c1.4-4.6 4.6-7 7-7s5.6 2.4 7 7"/>
        </svg>
        <h1>Create Your Account</h1>
        <p class="auth-card-subtitle">Start your journey. Become the hero of <span>your arc</span>.</p>

        <form id="signup-form" novalidate>
          <label class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
            <input type="text" name="username" placeholder="Username" autocomplete="username" required />
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="email" name="email" placeholder="Email Address" autocomplete="email" required />
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <input type="password" name="password" placeholder="Password" autocomplete="new-password" required />
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required />
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <input type="date" name="dateOfBirth" placeholder="Date of Birth" required />
          </label>

          <button type="submit" class="btn btn-primary">
            Create Account
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <div class="auth-switch">
          Already have an account? <a href="login.html">Login Here</a>
        </div>
      </div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
