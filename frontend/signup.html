<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — FocusArc</title>
  <link rel="icon" href="/assets/logo/logo.png.png" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/signup.css" />
  <link rel="stylesheet" href="css/theme-select.css" />
</head>
<body class="a-page">
  <div class="a-shell">
    <section class="vis" style="--auth-bg: url('/assets/backgrounds/signup-bg.png');">
      <svg class="a-leaf" style="top:15%; left:15%; width:22px; height:22px;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.5"/></svg>
      <svg class="a-leaf" style="top:55%; left:65%; width:20px; height:20px; animation-delay:3s;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.4"/></svg>

      <div class="vis-content">
        <div class="vis-brand">
          <img class="b-icon" src="/assets/logo/logo.png.png" alt="FocusArc" />
          <span class="b-text brand">FocusArc</span>
        </div>
        <div class="vis-tag">Study Quest System</div>
        <p class="vis-copy">Create your account and begin your <span>study arc</span> today.</p>
      </div>

      <img class="a-char a-blend" src="/assets/characters/signupcharacter.png" alt="Your study companion" />
    </section>

    <section class="a-form">
      <div class="a-card fade">
        <i class="ac-icon" data-lucide="user-plus"></i>
        <h1>Create Your Account</h1>
        <p class="ac-sub">Start your journey. Become the hero of <span>your arc</span>.</p>

        <form id="signup-form" novalidate>
          <label class="field" id="username-field">
            <i data-lucide="user"></i>
            <input type="text" name="username" placeholder="Username" autocomplete="username" required />
          </label>
          <p class="f-err" id="username-error" hidden></p>
          <label class="field" id="email-field">
            <i data-lucide="mail"></i>
            <input type="email" name="email" placeholder="Email Address" autocomplete="email" required />
          </label>
          <p class="f-err" id="email-error" hidden>Enter a Gmail address ending in @gmail.com, like richa123@gmail.com.</p>
          <label class="field" id="password-field">
            <i data-lucide="lock"></i>
            <input type="password" name="password" placeholder="Password" autocomplete="new-password" required />
          </label>
          <p class="f-err" id="password-error" hidden></p>
          <label class="field" id="confirmPassword-field">
            <i data-lucide="lock"></i>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required />
          </label>
          <p class="f-err" id="confirmPassword-error" hidden></p>
          <label class="field" id="dateOfBirth-field">
            <i data-lucide="calendar"></i>
            <input type="date" name="dateOfBirth" placeholder="Date of Birth" required />
          </label>
          <p class="f-err" id="dateOfBirth-error" hidden></p>

          <button type="submit" class="btn btn-p">
            Create Account
            <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
          </button>
        </form>

        <div class="a-switch">
          Already have an account? <a href="login.html">Login Here</a>
        </div>
      </div>
    </section>
  </div>

  <script src="js/vendor/lucide.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/themeSelect.js"></script>
  <script>refreshIcons();</script>
</body>
</html>
