<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FocusArc</title>
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-visual" style="--auth-bg: url('/assets/backgrounds/login-bg.png');">
      <svg class="auth-leaf" style="top:12%; left:20%; width:26px; height:26px;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.5"/></svg>
      <svg class="auth-leaf" style="top:60%; left:8%; width:18px; height:18px; animation-delay:2s;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.5"/></svg>
      <svg class="auth-leaf" style="top:30%; left:55%; width:20px; height:20px; animation-delay:4s;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.4"/></svg>

      <div class="auth-visual-brand">
        <svg class="auth-visual-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z"/><path d="M6 19c4-5 8-8 13-11"/></svg>
        <span class="auth-visual-brand-text brand">FocusArc</span>
      </div>
      <div class="auth-visual-tagline">Study Quest System</div>
      <p class="auth-visual-copy">Turn your study tasks into <span>powerful quests.</span></p>

      <img class="auth-character" src="/assets/characters/logincharacter.png" alt="Your study companion" />
    </section>

    <section class="auth-form-panel">
      <div class="auth-card fade-in">
        <i class="auth-card-icon" data-lucide="circle-check-big"></i>
        <h1>Welcome Back</h1>
        <p class="auth-card-subtitle">Log in to continue <span>your journey</span></p>

        <form id="login-form" novalidate>
          <label class="field">
            <i data-lucide="user"></i>
            <input type="text" name="username" placeholder="Username" autocomplete="username" required />
          </label>
          <label class="field">
            <i data-lucide="lock"></i>
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
          </label>
          <label class="field">
            <i data-lucide="calendar"></i>
            <input type="date" name="dateOfBirth" placeholder="Date of Birth" required />
          </label>

          <button type="submit" class="btn btn-primary">
            Login
            <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
          </button>
        </form>

        <div class="auth-switch">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>refreshIcons();</script>
</body>
</html>
