<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FocusArc</title>
  <link rel="icon" href="/assets/logo/logo.png.png" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/theme-select.css" />
</head>
<body class="a-page login">
  <div class="a-shell">
    <section class="vis" style="--auth-bg: url('/assets/backgrounds/login-bg.png');">
      <svg class="a-leaf" style="top:12%; left:20%; width:26px; height:26px;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.5"/></svg>
      <svg class="a-leaf" style="top:60%; left:8%; width:18px; height:18px; animation-delay:2s;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.5"/></svg>
      <svg class="a-leaf" style="top:30%; left:55%; width:20px; height:20px; animation-delay:4s;" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20C5 10 12 4 20 4c0 8-6 15-16 16z" opacity="0.4"/></svg>

      <div class="vis-content">
        <div class="vis-brand">
          <span class="b-spark" aria-hidden="true">✦</span>
          <img class="b-icon" src="/assets/logo/logo.png.png" alt="FocusArc" />
          <span class="b-text brand">FocusArc</span>
        </div>
        <div class="vis-tag">Study Quest System</div>
        <p class="vis-copy">Turn your study tasks into <span>powerful quests.</span></p>
      </div>

      <div class="a-col">
        <img class="a-char" src="/assets/characters/logincharacter.png" alt="Your study companion" />
      </div>
    </section>

    <section class="a-form">
      <div class="a-card fade">
        <img class="ac-icon" src="/assets/logo/logo.png.png" alt="" />
        <h1>Welcome Back</h1>
        <p class="ac-sub">Log in to continue <span>your journey</span></p>

        <form id="login-form" novalidate>
          <label class="field">
            <i data-lucide="user"></i>
            <input type="text" name="username" placeholder="Username" autocomplete="username" required />
          </label>
          <label class="field">
            <i data-lucide="lock"></i>
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
          </label>

          <button type="submit" class="btn btn-p">
            Login
            <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
          </button>
        </form>

        <div class="a-switch">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </section>
  </div>

  <script src="js/vendor/lucide.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/themeSelect.js"></script>
  <script>refreshIcons();</script>
</body>
</html>
