<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest Board — FocusArc</title>
  <link rel="icon" href="/assets/logo/logo.png.png" />
  <link rel="stylesheet" href="css/themes.css" />
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/questboard.css" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div class="p-head">
        <h1>Quest Board</h1>
      </div>

      <section class="card c-hero">
        <img class="ch-img" id="companion-image" src="" alt="" hidden />
        <div class="qt-card">
          <div class="qt-mark">&ldquo;</div>
          <p class="ch-quote" id="companion-quote">Loading your study companion…</p>
        </div>
      </section>

      <div class="toolbar">
        <div class="tabs">
          <button class="tab active" data-filter="ALL">All</button>
          <button class="tab" data-filter="TODO">To Do</button>
          <button class="tab" data-filter="IN_PROGRESS">In Progress</button>
          <button class="tab" data-filter="COMPLETED">Completed</button>
        </div>
        <div style="display:flex; align-items:center; gap:16px;">
          <span class="q-badge"><strong id="quest-count">—</strong> / 10 quests</span>
          <button class="btn btn-p" id="add-quest-btn">
            <i data-lucide="plus" style="width:16px;height:16px;"></i>
            Add Quest
          </button>
        </div>
      </div>

      <div class="q-list" id="quest-list"></div>
    </main>
  </div>

  <div class="m-bg" id="quest-modal-backdrop">
    <div class="modal">
      <h2 id="quest-modal-title">New Quest</h2>
      <form id="quest-form">
        <input type="hidden" name="questId" />
        <label class="field">
          <input type="text" name="title" placeholder="Quest title" maxlength="19" required />
        </label>
        <p class="f-err" id="title-error" hidden></p>
        <textarea name="description" placeholder="Quest description" maxlength="99" required></textarea>
        <p class="f-err" id="description-error" hidden></p>
        <div class="m-acts">
          <button type="button" class="btn btn-s" id="quest-modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-p" id="quest-modal-submit">Save Quest</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/vendor/lucide.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/questboard.js"></script>
</body>
</html>
