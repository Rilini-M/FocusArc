<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest Board — FocusArc</title>
  <link rel="icon" href="/assets/logo/logo.png.png" />
  <link rel="stylesheet" href="css/themes.css" />
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/questboard.css" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div class="p-head">
        <h1>Quest Board</h1>
      </div>

      <section class="card c-hero">
        <img class="ch-img" id="companion-image" src="" alt="" hidden />
        <div class="qt-card">
          <div class="qt-mark">&ldquo;</div>
          <p class="ch-quote" id="companion-quote">Loading your study companion…</p>
        </div>
      </section>

      <div class="toolbar">
        <div class="q-heading">
          <h2>Your Quests</h2>
          <span class="q-badge"><strong id="quest-count">—</strong> / 10 quests</span>
        </div>
        <button class="btn btn-p" id="add-quest-btn">
          <i data-lucide="plus" style="width:16px;height:16px;"></i>
          Create Quest
        </button>
      </div>

      <div class="q-list" id="quest-list"></div>
    </main>
  </div>

  <div class="m-bg" id="quest-modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quest-modal-title">
      <h2 id="quest-modal-title">Create Quest</h2>
      <form id="quest-form" novalidate>
        <input type="hidden" name="questId" />

        <label class="q-label" for="quest-title">Quest Title</label>
        <div class="field">
          <input type="text" id="quest-title" name="title" placeholder="e.g. Organic Chemistry" maxlength="19" required />
        </div>
        <p class="f-err" id="title-error" hidden></p>

        <label class="q-label" for="quest-description">Description</label>
        <textarea id="quest-description" name="description" placeholder="What will you study?" maxlength="99" required></textarea>
        <p class="f-err" id="description-error" hidden></p>

        <span class="q-label" id="quest-file-label">Attach File <span class="q-optional">(optional)</span></span>
        <div class="q-file" aria-labelledby="quest-file-label">
          <input type="file" id="quest-file" name="file" class="q-file-input" />
          <label for="quest-file" class="btn btn-s q-file-btn"><i data-lucide="paperclip" style="width:15px;height:15px;"></i> Choose File</label>
          <span class="q-file-name" id="quest-file-name">No file chosen</span>
          <button type="button" class="i-btn danger" id="quest-file-clear" aria-label="Remove attachment" hidden><i data-lucide="x" style="width:15px;height:15px;"></i></button>
        </div>
        <p class="q-hint" id="quest-file-hint"></p>
        <p class="f-err" id="file-error" hidden></p>

        <label class="q-label" for="quest-time">Time Required</label>
        <div class="q-time">
          <div class="field q-time-field">
            <input type="number" id="quest-time" name="timeRequired" min="1" max="1440" step="1" inputmode="numeric" placeholder="60" required />
            <span class="q-unit">minutes</span>
          </div>
          <div class="q-presets" role="group" aria-label="Quick times">
            <button type="button" class="q-preset" data-minutes="30">30</button>
            <button type="button" class="q-preset" data-minutes="45">45</button>
            <button type="button" class="q-preset" data-minutes="60">60</button>
            <button type="button" class="q-preset" data-minutes="90">90</button>
          </div>
        </div>
        <p class="f-err" id="timeRequired-error" hidden></p>

        <div class="m-acts">
          <button type="button" class="btn btn-s" id="quest-modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-p" id="quest-modal-submit">Create Quest</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/vendor/lucide.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/questboard.js"></script>
</body>
</html>
