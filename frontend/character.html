<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Guide — FocusArc</title>
  <link rel="stylesheet" href="css/themes.css" />
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/character.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main-content">
      <div class="page-header">
        <h1>Study Companion</h1>
        <p>Your anime guide for motivation</p>
      </div>

      <section class="card companion-hero" id="companion-hero">
        <span class="companion-hero-label">Character Guide</span>

        <div class="companion-hero-character">
          <div class="companion-hero-image-wrap">
            <img class="companion-hero-image" id="hero-image" src="" alt="" hidden />
          </div>
          <div class="companion-hero-identity" id="hero-identity" hidden>
            <h2 class="companion-hero-name" id="hero-name"></h2>
            <span class="companion-hero-accent" aria-hidden="true"></span>
            <p class="companion-hero-desc" id="hero-description"></p>
          </div>
        </div>

        <div class="companion-hero-divider" aria-hidden="true"></div>

        <div class="companion-hero-quote-card">
          <div class="companion-hero-quote-mark">&ldquo;</div>
          <p class="companion-hero-quote" id="hero-quote">Loading your study companion…</p>
        </div>
      </section>

      <section class="card companion-picker">
        <h3>Choose Your Companion</h3>
        <p class="companion-picker-sub">Every arc has a hero. Pick yours.</p>
        <div class="companion-grid" id="companion-grid"></div>
      </section>
    </main>
  </div>

  <script src="js/vendor/lucide.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/character.js"></script>
</body>
</html>
